[project]
name = "docvault-ai"
version = "0.1.0"
description = "Document knowledge workspace with grounded conversations"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "python-multipart>=0.0.20",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2",
  "pgvector>=0.4,<1", "redis>=5,<7", "rq>=2.3,<3",
  "langgraph>=1,<2", "openai>=2,<3", "httpx>=0.28,<1", "tiktoken>=0.9,<1",
]

[project.optional-dependencies]
parsing = ["docling>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires test PostgreSQL and Redis", "live: opt-in real provider calls"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
